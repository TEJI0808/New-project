[GENERAL]
authorized_user = auditmanager

[PATHS]
workspace = /course_project/audit
log_file = /var/log/sysaudit_daemon.log
state_file = /var/lib/sysaudit/last_run.txt
delegation_file = /var/lib/sysaudit/delegated_users.json

[STORAGE]
max_storage_mb = 100
archive_retention_days = 14
# If true, exceeding the limit stops the cycle with exit code 5.
# If false, the program logs a warning and continues.
stop_on_limit = false

[SCHEDULE]
# The daemon runs at the next local midnight, then every interval_days.
interval_days = 3
